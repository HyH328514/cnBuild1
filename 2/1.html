<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间轴</title>
    <!-- 引入外部CSS文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="z_timeline">
        <div class="z_progress-bar" id="z_progressBar">
            <div class="z_progress-indicator" id="z_progressIndicator"></div>
            <div class="z_progress-thumb" id="z_progressThumb"></div>
            <div class="z_time-markers" id="z_timeMarkers"></div>
        </div>
    </div>
    
    <!-- 当前时期显示 -->
    <div class="z_current-period" id="z_currentPeriod"></div>
    
    <!-- 滚动提示 -->
    <div class="z_scroll-hint">使用鼠标滚轮滚动切换时期</div>

    <!-- 引入外部JS文件 -->
    <script src="script.js"></script>
</body>
</html>
