<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史长河中的中国建筑</title>
  <link rel="stylesheet" type="text/css" href="./css/common.css"/>
  <link rel="stylesheet" type="text/css" href="./css/index.css"/>
</head>
<body>
  <div class="BOX">
    <!-- 标题区域 -->
    <div class="title">
      <h1>历史长河中的中国建筑</h1>
      <p>——从原始社会到明清时期的文化演变</p>
    </div>

    <!-- 轮播图区域：移除ID，仅保留class -->
    <div class="myImage">
      <div class="carousel">
        <ul class="carousel-ul"> <!-- 用class替代id -->
        </ul>
      </div>
    </div>

    <!-- 时间轴区域：移除所有ID，仅保留class -->
    <div class="myContent">
      <div class="z_timeline">
        <div class="z_progress-bar"> <!-- 移除id="z_progressBar" -->
          <div class="z_progress-indicator"></div> <!-- 移除id -->
          <div class="z_progress-thumb"></div> <!-- 移除id -->
          <div class="z_time-markers"></div> <!-- 移除id -->
        </div>
      </div>
      <div class="z_current-period"></div> <!-- 移除id -->
      <div class="z_scroll-hint">使用鼠标滚轮滚动切换时期</div>
    </div>
  </div>

  <script src="./js/page/index.js"></script>
</body>
</html>
