<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>历史长河中的中国建筑</title>
  <link rel="stylesheet" type="text/css" href="./css/common.css"/>
  <link rel="stylesheet" type="text/css" href="./css/index.css"/>
</head>
<body>
  <div class="BOX">
    <!-- 标题区域 -->
    <div class="title">
      <h1>历史长河中的中国建筑</h1>
      <p>——从原始社会到明清时期的文化演变</p>
    </div>

    <!-- 轮播图区域 -->
    <div class="myImage">
      <div class="carousel">
        <ul>
          <li><img src=""></li>
          <li><img src=""></li>

          <li><img src=""></li>
          <li><img src=""></li>

        </ul>
      </div>
    </div>

    <!-- 时间轴区域（整合原2/1.html的核心DOM） -->
    <div class="myContent">
      <!-- 原时间轴容器 -->
      <div class="z_timeline">
        <div class="z_progress-bar" id="z_progressBar">
          <div class="z_progress-indicator" id="z_progressIndicator"></div>
          <div class="z_progress-thumb" id="z_progressThumb"></div>
          <div class="z_time-markers" id="z_timeMarkers"></div>
        </div>
      </div>
      <!-- 当前时期显示 -->
      <div class="z_current-period" id="z_currentPeriod"></div>
      <!-- 滚动提示 -->
      <div class="z_scroll-hint">使用鼠标滚轮滚动切换时期</div>
    </div>
  </div>

  <!-- 整合后的JS -->
